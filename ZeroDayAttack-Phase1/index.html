<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Day Attack Detection</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>🛡️ Security Monitor</h1>
            <p class="subtitle">Real-time Zero-Day Attack Detection</p>
        </div>

        <!-- Main Grid -->
        <div class="main-grid">
            <!-- Controls Card -->
            <div class="controls-card">
                <h2>Detection Settings</h2>

                <div class="control-group">
                    <div class="threshold-display">
                        <label>Sensitivity Level</label>
                        <span id="threshold-value">0.6</span>
                    </div>
                    <input type="range" id="threshold" min="0" max="1" step="0.01" value="0.6">
                </div>

                <button id="runBtn">▶️ Start Analysis</button>

                <div class="loading" id="loading">
                    <div class="spinner"></div>
                    <p>Analyzing network traffic...</p>
                </div>
            </div>

            <!-- Stats Card -->
            <div class="card">
                <h2>Detection Results</h2>
                <div class="stats-grid" id="stats" style="display: none;">
                    <div class="stat-box">
                        <div class="stat-label">🟢 Normal Traffic</div>
                        <div class="stat-value" id="normal-count">0</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-label">🔴 Threats Detected</div>
                        <div class="stat-value" id="anomaly-count">0</div>
                    </div>
                </div>
                <div class="no-data" id="empty-state">Run analysis to see results</div>
            </div>
        </div>

        <!-- Chart Card -->
        <div class="results-card">
            <h2>Anomaly Score Distribution</h2>
            <div class="chart-container">
                <canvas id="anomalyChart"></canvas>
            </div>
        </div>

        <!-- Results Table -->
        <div class="results-card">
            <h2>Detection Log</h2>
            <table id="results">
                <thead>
                    <tr>
                        <th>Index</th>
                        <th>Risk Score</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="3" class="no-data">Click "Start Analysis" to begin</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.getElementById("runBtn").addEventListener("click", runDetection);
    </script>

</body>

</html>
